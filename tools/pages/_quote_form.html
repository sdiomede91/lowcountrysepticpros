<form class="form" action="/api/quote" method="POST">
          <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="form-row">
            <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" maxlength="100" required></div>
            <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30" required></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="120"></div>
            <div class="field"><label for="town">Town / zip</label><input id="town" name="town" type="text" autocomplete="postal-code" maxlength="80" required></div>
          </div>
          <div class="field">
            <label for="service">Service needed</label>
            <select id="service" name="service" required>
              <option value="" selected disabled>Choose a service</option>
              <option>Septic tank pumping</option>
              <option>Septic inspection</option>
              <option>Septic repair</option>
              <option>Drain field service</option>
              <option>New system installation</option>
              <option>Emergency / backup</option>
              <option>Not sure</option>
            </select>
          </div>
          <div class="field"><label for="message">Tell us more (optional)</label><textarea id="message" name="message" maxlength="2000" placeholder="When was it last pumped? What are you noticing?"></textarea></div>
          <button class="btn btn--primary" type="submit">Send my request</button>
          <p class="form-fine">We'll only use your information to respond to your request. See our <a href="/privacy">privacy policy</a>.</p>
        </form>
